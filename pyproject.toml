[project]
name = "backoffice-copilot"
version = "0.2.1"
description = "Morning finance checks for a hotel, with a Claude agent that investigates through MCP tools and asks before it changes anything."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13,<3",
    "mcp>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/copilot/data.py" = ["E501"]  # seed rows read best one per line
"src/copilot/demo.py" = ["E501"]  # recorded answers read best as written

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
